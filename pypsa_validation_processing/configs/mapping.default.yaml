# Mapping of IAMC variable names to statistics function names.
# Each entry maps the full IAMC variable string to the name of the
# corresponding function in statistics_functions.py.
#
# Example:
# Primary Energy|Coal: primary_energy_coal

Final Energy [by Carrier]|Electricity: Final_Energy_by_Carrier__Electricity
Final Energy [by Carrier]|Coal: Final_Energy_by_Carrier__Coal
Final Energy [by Carrier]|Natural Gas: Final_Energy_by_Carrier__Natural_Gas
Final Energy [by Carrier]|Oil: Final_Energy_by_Carrier__Oil
Net Imports|Oil: Net_Imports__Oil
Final Energy [by Carrier]|District Heat: Final_Energy_by_Carrier__District_Heat
Net Imports|Electricity: Net_Imports__Electricity
Final Energy [by Sector]|Transportation: Final_Energy_by_Sector__Transportation
Final Energy [by Sector]|Industry: Final_Energy_by_Sector__Industry
Final Energy [by Sector]|Agriculture: Final_Energy_by_Sector__Agriculture
Final Energy [by Sector]|Residential and Commercial: Final_Energy_by_Sector__Residential_and_Commercial
Price|Final Energy|Industry|Electricity: {function: Price__Final_Energy__Industry__Electricity, aggregation: intensive}
Price|Final Energy|Industry|Gases: {function: Price__Final_Energy__Industry__Gases, aggregation: intensive}
Price|Final Energy|Industry|Hydrogen: {function: Price__Final_Energy__Industry__Hydrogen, aggregation: intensive}
Price|Final Energy|Industry|Solids|Biomass: {function: Price__Final_Energy__Industry__Solids__Biomass, aggregation: intensive}
Price|Final Energy|Industry|Solids|Coal: {function: Price__Final_Energy__Industry__Solids__Coal, aggregation: intensive}
Price|Final Energy|Industry|Liquids|Oil: {function: Price__Final_Energy__Industry__Liquids__Oil, aggregation: intensive}
