[workspace]
name = "pypsa-validation-processing"
version = "0.1.0"
description = "Processing pypsa output to IAMC-Variables for validation workflow"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tasks]
workflow = "python workflow.py"
workflow_test = """python workflow.py --config pypsa_validation_processing/configs/test/country-year-all.yaml&&
                python workflow.py --config pypsa_validation_processing/configs/test/country-timeseries-AT.yaml&&
                python workflow.py --config pypsa_validation_processing/configs/test/country-year-EU.yaml&&
                python workflow.py --config pypsa_validation_processing/configs/test/region-year-AT.yaml&&
                python workflow.py --config pypsa_validation_processing/configs/test/region-timeseries-all.yaml&&
                python workflow.py --config pypsa_validation_processing/configs/test/minimal.yaml&&
                pytest tests/ -v"""
test = "pytest tests/ -v --cov=pypsa_validation_processing --cov-report=term-missing --cov-fail-under=90"

[dependencies]
python = ">=3.11"
numpy = ">=1.18.0"
pyyaml = ">=5.3"
pytest = ">=7.0"
pytest-cov = ">=4.0"
pytest-mock = ">=3.0"
openpyxl = ">=3.0"
black = ">=26.5.1,<27"

[pypi-dependencies]
pandas = ">=1.0.0"
pyam-iamc = ">=2.0.0"
nomenclature-iamc = ">=0.29"
pypsa = ">=1.1"
pypsa-validation-processing = { path = ".", editable = true }
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
mkdocstrings = { version = ">=0.26", extras = ["python"] }

[feature.notebook.dependencies]
marimo = ">=0.24"
matplotlib = ">=3.8"

[feature.notebook.tasks]
notebook = "marimo edit notebooks/co2_industry_prices.py"

[environments]
default = { solve-group = "default" }
notebook = { features = ["notebook"], solve-group = "default" }
